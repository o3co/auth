# Client registrations for the cross-component E2E, mounted over the
# standalone template's `config/clients.yaml` (which ships empty).
#
# `firstParty: true` is required for a client to use `/authorize`, with no
# opt-out. `/authorize` mints a code as soon as the session is authenticated,
# with no consent step, so the provider admits only clients the operator
# vouches for.
#
# `tokenEndpointAuthMethod: "none"` makes this a public client, for which the
# provider mandates PKCE/S256 at `/authorize` regardless of operator config
# (RFC 9700 §2.1.1), so the suite exercises the strict path.
#
# `allowedAudiences` is what lets the RFC 8707 `resource` parameter stamp
# `aud: https://api.e2e.test` on the access token, the value
# auth.policy-verifier pins via OAUTH_JWT_AUDIENCE. The URL here is the one
# deliberate second copy of OAUTH_JWT_AUDIENCE: this file is volume-mounted,
# so compose interpolation cannot reach it.
#
# `allowedScopes` is a provider-vocabulary ceiling the provider compares
# opaquely. The `read:project` / `read:project.member` entries are written in
# auth.policy-verifier's `{action}:{resourceType}` grammar
# (ResourceActionScopeRuleCollector) because the ABAC suite needs tokens whose
# scope strings satisfy the verifier's derived rule. Grammar owner:
# auth.policy-verifier; string owner: this registration. See
# docs/claims-contract.md.
e2e-app:
  tokenEndpointAuthMethod: "none"
  firstParty: true
  allowedRedirectUris:
    - "http://localhost:9099/callback"
  allowedScopes:
    - "openid"
    - "email"
    - "read:project"
    - "read:project.member"
  allowedAudiences:
    - "https://api.e2e.test"
  allowedGrantTypes:
    - "authorization_code"
    - "refresh_token"
    - "session"

# A deliberately unmarked client. `/authorize` must refuse it with
# `unauthorized_client` — this is the negative half of the first-party
# invariant, and it is registered here so the suite can prove the refusal
# rather than assume it.
e2e-third-party:
  tokenEndpointAuthMethod: "none"
  firstParty: false
  allowedRedirectUris:
    - "http://localhost:9099/callback"
  allowedScopes:
    - "read:project"
  allowedAudiences:
    - "https://api.e2e.test"
  allowedGrantTypes:
    - "authorization_code"

# The client auth.proxy's injection-mode services present on the `session`
# grant (INJECTION_CLIENT_ID in tests/docker-compose.yml). A public client:
# the proxy sends `client_id` in the body and the browser's session cookie,
# never a secret (auth.proxy src/modes/injection/session-grant-client.mts).
#
# The session grant stamps `aud` from the first `allowedAudiences` entry,
# falling back to the client id (auth.provider
# packages/oauth/src/grants/session.mts), which gives an injected token the
# audience the E2E pins. `firstParty` is read only at `/authorize`, which this
# client never calls. A registration of its own, not `e2e-app`, so the suites
# can tell from `azp` that the upstream's token was minted for the proxy.
e2e-bff:
  tokenEndpointAuthMethod: "none"
  allowedScopes:
    - "read:project"
  allowedAudiences:
    - "https://api.e2e.test"
  allowedGrantTypes:
    - "session"

# The confidential client auth.proxy's credentialed validation service
# authenticates to `POST /oauth/introspect` as (CLIENT_ID / CLIENT_SECRET in
# tests/docker-compose.yml). Introspection refuses public clients (RFC 7662
# §2.1), hence `client_secret_basic`.
#
# With a client identified, the provider pins the introspected token's
# audience to `allowedAudiences ∪ {clientId}` (auth.provider
# packages/oauth/src/routes.mts): a token for any other audience is
# `active: false`. The E2E audience is registered here so the resource
# server's own tokens introspect as active; the suite also presents a
# provider-issued token for another audience to prove the pin holds.
#
# The secret is plain text on purpose (the repository compares a literal when
# the stored value is not a bcrypt hash) and is the one deliberate second copy
# of the proxy's CLIENT_SECRET, since this file is out of interpolation's
# reach. Its `+`, `/` and `=` exercise the RFC 6749 §2.3.1 form encoding of
# the Basic header end to end. Disposable rig only.
#
# `allowedGrantTypes: []` denies every grant: the client only introspects. An
# absent list would mean no restriction (auth.provider
# packages/core/src/repositories/types.mts).
e2e-resource-server:
  tokenEndpointAuthMethod: "client_secret_basic"
  clientSecret: "AfAFXyzwkkaSic+H6vMwW/Lb7ud5u7C6j1TinH8AzF0="
  allowedAudiences:
    - "https://api.e2e.test"
  allowedGrantTypes: []
