name: e2e

# The release gate is this workflow's pinned run: push, pull_request, and a
# workflow_dispatch left at its defaults test every sibling at the revision
# pinned in the Makefile. A run that overrides a revision tests something else
# and is not the gate — its run name and its check name say so, and the job
# summary names every revision it tested. The nightly run against every
# sibling's develop is e2e-develop.yml, which calls this workflow.
run-name: >-
  ${{
    (inputs.provider_rev || inputs.proxy_rev || inputs.verifier_rev)
    && format('e2e with overrides, not the release gate: provider={0} proxy={1} verifier={2}',
      inputs.provider_rev || 'pin', inputs.proxy_rev || 'pin', inputs.verifier_rev || 'pin')
    || ''
  }}

on:
  push:
    branches: [develop]
  pull_request:
  # Each input takes a SHA, a tag, or origin/<branch>: the Makefile runs
  # `git fetch origin` and then `git checkout --detach <rev>`, so write a branch
  # as origin/<branch>. A bare branch name resolves only to a local branch, and
  # a clone has one only for the default branch (as of the clone); any other
  # bare name fails. Empty keeps the Makefile's pin.
  workflow_dispatch:
    inputs:
      provider_rev:
        description: "auth.provider revision: SHA, tag or origin/<branch>. Empty keeps the Makefile pin."
        type: string
        default: ""
      proxy_rev:
        description: "auth.proxy revision: SHA, tag or origin/<branch>. Empty keeps the Makefile pin."
        type: string
        default: ""
      verifier_rev:
        description: "auth.policy-verifier revision: SHA, tag or origin/<branch>. Empty keeps the Makefile pin."
        type: string
        default: ""
  # Called by e2e-develop.yml with every input at origin/develop. The checkout
  # below names this suite's repository, so a caller from another repository
  # gets this suite (at develop), never its own code.
  workflow_call:
    inputs:
      provider_rev:
        type: string
        default: ""
      proxy_rev:
        type: string
        default: ""
      verifier_rev:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test-e2e:
    # A run with an override posts its check under a name of its own, so it is
    # never taken for the gate's `test-e2e`.
    name: ${{ (inputs.provider_rev || inputs.proxy_rev || inputs.verifier_rev) && 'test-e2e (overrides, not the release gate)' || 'test-e2e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Always this suite, never a caller's repository: run from here it is the
      # commit under test (the push, or the pull request's merge commit); called
      # from another repository through workflow_call it is develop.
      - uses: actions/checkout@v4
        with:
          repository: o3co/auth
          ref: ${{ github.repository == 'o3co/auth' && github.sha || 'develop' }}
          persist-credentials: false

      # auth.provider's .github/workflows/umbrella-e2e.yml runs this suite on
      # its pull requests and mirrors the environment steps below (node,
      # corepack and pnpm, the HTTPS rewrite, ~/.npmrc) and the logs and
      # teardown steps at the end. Change them there too.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm via corepack
        run: |
          npm install -g corepack --force
          corepack enable
          corepack prepare pnpm@10.29.3 --activate

      # `make setup` clones sibling repos with SSH URLs; runners have no SSH
      # key, and all o3co repos are public, so rewrite to plain HTTPS.
      - name: Clone sibling repos over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # docker-compose.yml mounts ~/.npmrc as a build secret. All @o3co
      # packages resolve from the public npm registry, so an empty file is
      # enough — the secret just has to exist.
      - name: Provide npmrc secret file
        run: touch ~/.npmrc

      # An empty input keeps the Makefile's pin, so only a given one is passed:
      # a variable on make's command line overrides the Makefile's `:=`, and an
      # empty one would override the pin with nothing. A given one is checked
      # first, because make expands the value again — `$(shell …)` in it would
      # run, and a `"` would close the Makefile's quoting — so only the
      # characters a SHA, a tag or origin/<branch> needs are let through.
      - name: Check out the sibling revisions
        env:
          PROVIDER_REV_INPUT: ${{ inputs.provider_rev }}
          PROXY_REV_INPUT: ${{ inputs.proxy_rev }}
          VERIFIER_REV_INPUT: ${{ inputs.verifier_rev }}
        run: |
          args=()
          rev_pattern='^[A-Za-z0-9][A-Za-z0-9._/-]*$'
          add() { # <input name> <Makefile variable> <value>
            if [ -z "$3" ]; then return 0; fi
            if [[ ! "$3" =~ $rev_pattern ]]; then
              echo "::error::$1 is not a SHA, a tag or origin/<branch>: $(printf '%q' "$3"). Use letters, digits and . _ / - only, starting with a letter or digit."
              exit 1
            fi
            args+=("$2=$3")
          }
          add provider_rev PROVIDER_REV "$PROVIDER_REV_INPUT"
          add proxy_rev PROXY_REV "$PROXY_REV_INPUT"
          add verifier_rev VERIFIER_REV "$VERIFIER_REV_INPUT"
          make setup "${args[@]}"

      # Each revision is resolved to the SHA it checked out, written to the job
      # summary next to the Makefile's pin, and passed to the suite as that SHA,
      # so a branch that moves while the suite runs cannot change what it tests.
      # A run is the gate when nothing was overridden; whether every sibling
      # happens to sit at its pin is reported as a separate fact, since
      # origin/develop can equal a pin.
      - name: Record the revisions under test
        id: revs
        env:
          PROVIDER_REV_INPUT: ${{ inputs.provider_rev }}
          PROXY_REV_INPUT: ${{ inputs.proxy_rev }}
          VERIFIER_REV_INPUT: ${{ inputs.verifier_rev }}
        run: |
          rows=""
          at_pins=true
          record() { # <output key> <repository> <Makefile variable> <requested revision>
            local pin sha
            pin="$(sed -n "s/^$3 := //p" Makefile)"
            sha="$(git -C "repos/$2" rev-parse HEAD)"
            echo "$1=$sha" >> "$GITHUB_OUTPUT"
            if [ "$sha" != "$pin" ]; then at_pins=false; fi
            rows+="| [o3co/$2](https://github.com/o3co/$2/commit/$sha) | ${4:-pin} | \`$sha\` | \`$pin\` |"$'\n'
          }
          record provider auth.provider PROVIDER_REV "$PROVIDER_REV_INPUT"
          record proxy auth.proxy PROXY_REV "$PROXY_REV_INPUT"
          record verifier auth.policy-verifier VERIFIER_REV "$VERIFIER_REV_INPUT"
          {
            echo "## Revisions under test"
            echo
            if [ -z "$PROVIDER_REV_INPUT$PROXY_REV_INPUT$VERIFIER_REV_INPUT" ]; then
              echo "**Release-gate run:** no revision was overridden."
            else
              echo "**Not a release-gate run:** at least one revision was overridden."
            fi
            echo
            if [ "$at_pins" = true ]; then
              echo "Every sibling is at its Makefile pin."
            else
              echo "At least one sibling is not at its Makefile pin."
            fi
            echo
            echo "The suite: o3co/auth \`$(git rev-parse HEAD)\`."
            echo
            echo "| Repository | Requested | Tested commit | Makefile pin |"
            echo "| --- | --- | --- | --- |"
            printf '%s' "$rows"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run E2E suite
        env:
          PROVIDER_SHA: ${{ steps.revs.outputs.provider }}
          PROXY_SHA: ${{ steps.revs.outputs.proxy }}
          VERIFIER_SHA: ${{ steps.revs.outputs.verifier }}
        run: make test-e2e PROVIDER_REV="$PROVIDER_SHA" PROXY_REV="$PROXY_SHA" VERIFIER_REV="$VERIFIER_SHA"

      - name: Dump container logs on failure
        if: failure()
        run: make logs || true

      - name: Teardown
        if: always()
        run: make clean
