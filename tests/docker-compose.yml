services:
  redis:
    image: redis:7-alpine
    ports:
      - "6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5

  provider:
    build:
      context: ../repos/auth.provider
      dockerfile: ../../tests/dockerfiles/provider.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3099:3000"
    volumes:
      # The template ships an EMPTY clients.yaml and no users.yaml at all, so
      # the E2E supplies both. Paths are cwd-relative in application.conf and
      # the image's WORKDIR is /home/node/templates/standalone.
      - ./provider/clients.yaml:/home/node/templates/standalone/config/clients.yaml:ro
      - ./provider/users.yaml:/home/node/templates/standalone/config/users.yaml:ro
    environment:
      # ---- Old and new names ---------------------------------------------
      # The provider is moving most of the settings below to new
      # configuration paths, and a variable's name is derived from its path,
      # so the names change with them. The provider reads the variables below
      # only through `${?VAR}` in its .conf files and ignores a name it does
      # not read, so a renamed setting left under its old name alone would
      # fall back to its default silently. This suite runs against the pinned
      # provider and against provider develop (nightly, and on every
      # auth.provider pull request), so each renamed variable is set under
      # every name it has had, oldest first, one per line. The lines of a
      # group carry the same value; change them together. Every name is set
      # until PROVIDER_REV pins a provider that reads only the newest one.

      # The provider signs with EdDSA by default and has no HS256 fallback, so
      # the algorithm is named explicitly. The E2E uses HS256 because the
      # verifier requires https for a JWKS URI, allowing http only for
      # loopback, and here it would reach the provider at http://provider:3000,
      # a compose service name: a JWKS-based E2E would fail the verifier's boot
      # check, so the two services share a secret instead.
      - OAUTH_JWT_ALGORITHM=HS256
      - KEY_STORE_LOCAL_ALGORITHM=HS256
      # The provider requires the decoded secret to be at least 32 bytes,
      # measured at the smallest plausible reading. The value is defined once
      # in the Makefile and interpolated here, because the ABAC tests mint
      # tokens with the same secret. Both names interpolate the Makefile's
      # OAUTH_JWT_SECRET, which keeps its name: the verifier and the test
      # processes read it too.
      - OAUTH_JWT_SECRET=${OAUTH_JWT_SECRET:?run via make test-e2e}
      - KEY_STORE_LOCAL_SECRET=${OAUTH_JWT_SECRET:?run via make test-e2e}
      # auth.provider requires a canonical issuer and never derives one from the
      # request. It is an identifier, not a URL anything fetches, so the E2E
      # pins a fixed one both services agree on, defined once in the Makefile
      # like the secret.
      - OAUTH_JWT_ISSUER=${OAUTH_JWT_ISSUER:?run via make test-e2e}
      - SESSION_SECRET=lO0QH09fuKSGuViZ9myJbH3jsgai99A2GpC3RYRuy6Y=
      - SESSION_STORE_SECRET=lO0QH09fuKSGuViZ9myJbH3jsgai99A2GpC3RYRuy6Y=
      - SESSION_SECURE=false
      - SESSION_STORE_SECURE=false
      # __Host- prefixed default requires secure=true; plain-HTTP E2E needs both overrides
      - SESSION_NAME=auth.session
      - SESSION_STORE_NAME=auth.session
      # The suite exercises token issuance and ABAC with password logins
      # only, so MFA stays off. The template's switch is the only place that
      # turns it on; a written `mfa.mode` that contradicts it is refused.
      - MFA_MODE=off

      # ---- Redis-backed state -------------------------------------------
      # Deployment mode `multi` makes the provider itself audit this block:
      # boot fails, naming every offender, if any shared store is held in
      # process memory. The E2E declares it so a drift back to an in-memory
      # store is a red build, not a suite that silently stops exercising the
      # Redis paths.
      - DEPLOYMENT_MODE=multi
      - CORE_DEPLOYMENT_MODE=multi
      # One ioredis socket per replica (standaloneRedisClientsModule) backs
      # the refresh-token family store, the stores this block switches to
      # Redis, and those the template already puts there (the access-token
      # denylist, the replay seen-set). Its URL defaults to
      # redis://localhost:6379, which is nothing inside the container, so
      # without this the provider retries a dead socket.
      - REFRESH_TOKEN_FAMILY_STORE_REDIS_URL=redis://redis:6379
      - REDIS_CLIENTS_URL=redis://redis:6379
      # express-session's own store; a separate connection from the shared
      # ioredis socket above, hence a separate URL.
      - SESSION_STORAGE_REDIS_URL=redis://redis:6379
      - SESSION_STORE_STORAGE_REDIS_URL=redis://redis:6379
      # The user-session stores (session, RP registry, family and federation
      # indexes) and the subject-revocation pair, switched together: memory by
      # default, which deployment mode `multi` refuses.
      - USER_SESSION_STORES_ADAPTER=redis
      - STANDALONE_ADAPTERS_USER_SESSION_STORES=redis
      - ADAPTERS_USER_SESSION_STORES=redis
      # OAuth-endpoint rate-limit counters — memory by default, likewise
      # refused under multi.
      - RATE_LIMITER_ADAPTER=redis
      - STANDALONE_ADAPTERS_RATE_LIMITER=redis
      - ADAPTERS_RATE_LIMITER=redis
      # Authorization-code repository. Already the template default, pinned
      # here because the whole point of the suite is that codes round-trip
      # through Redis rather than a per-process Map.
      - OAUTH_CODE_ADAPTER=redis
      - STANDALONE_ADAPTERS_CODE_REPOSITORY=redis
      - ADAPTERS_CODE_REPOSITORY=redis
      # Federation token store (upstream IdP tokens per session): memory by
      # default, which deployment mode `multi` refuses because the
      # standalone's own memory modules declare replica-unsafe state. In its
      # default `encryptionMode = "required"` the Redis adapter encrypts every
      # envelope and needs its own 32-byte key; this one is for the disposable
      # E2E rig only, like the session secret above. The key is not among the
      # renamed settings, so it has one name.
      - FEDERATION_TOKEN_STORE_TYPE=redis
      - STANDALONE_ADAPTERS_FEDERATION_TOKEN_STORE=redis
      - ADAPTERS_FEDERATION_TOKEN_STORE=redis
      - REDIS_FEDERATION_TOKEN_STORE_ENCRYPTION_KEY=zeJFqmOncR4DvzI12bGZq4sIGkOKGHuD/ipQ8QZG7F4=

      # ---- Repositories --------------------------------------------------
      # The template defaults the user repository to "http", which needs an
      # external identity service. The E2E has none, so it uses the built-in
      # YAML directory and mounts users.yaml above.
      - CLIENT_USER_TYPE=yaml
      - STANDALONE_ADAPTERS_USER_REPOSITORY=yaml
      - ADAPTERS_USER_REPOSITORY=yaml

      # ---- Issuance policy the suite means to exercise --------------------
      # RFC 8707 resource indicators are opt-in (secure-by-default). The E2E
      # turns them on because that is how `/authorize?resource=...` stamps
      # `aud: https://api.e2e.test` on the access token — the audience
      # auth.policy-verifier pins. Without it the provider mints a token the
      # verifier is right to reject, and the cross-component contract cannot
      # be exercised at all.
      - OAUTH_RESOURCE_INDICATOR_ENABLED=true
      # Refuse to mint for a user whose email the Store has not verified. On
      # here (it ships off) so the happy path proves the gate lets a verified
      # user through, and the negative case proves it stops an unverified one.
      - OAUTH_REQUIRE_EMAIL_VERIFIED=true
      # The `session` grant, which the injection proxies below exchange the
      # browser's session cookie at.
      - OAUTH_GRANTS_SESSION_ENABLED=true
      - OAUTH_SESSION_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10

  proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3098:80"
    environment:
      # auth.mode has no default — the proxy refuses to boot without it
      - AUTH_MODE=validation
      - INTROSPECT_URL=http://provider:3000/oauth/introspect
      - UPSTREAM_BASEURL=http://provider:3000
    depends_on:
      provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10

  policy-verifier:
    build:
      context: ../repos/auth.policy-verifier
      dockerfile: ../../tests/dockerfiles/policy-verifier.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3097:3000"
    volumes:
      - ./abac/application.conf:/home/node/templates/standalone/config/application.conf:ro
    environment:
      # Same interpolated secret as the provider — under HS256 the verifier
      # holds the shared secret it verifies with.
      - OAUTH_JWT_SECRET=${OAUTH_JWT_SECRET:?run via make test-e2e}
      # auth.policy-verifier validates iss / aud / typ per RFC 9068 §4 and
      # refuses to boot without them. The issuer must match what the provider
      # stamps, and the audience must match what the provider's `resource`
      # parameter puts on the access token.
      - OAUTH_JWT_ISSUER=${OAUTH_JWT_ISSUER:?run via make test-e2e}
      - OAUTH_JWT_AUDIENCE=${OAUTH_JWT_AUDIENCE:?run via make test-e2e}
    depends_on:
      provider:
        condition: service_healthy
    healthcheck:
      # The stack-wide liveness path, the one the provider and the proxy are
      # probed on above. The verifier also answers `/healthcheck` as a
      # compatibility alias; the E2E probes the spelling docs/architecture.md
      # records.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10

  protected-api:
    image: node:24-alpine
    command: ["node", "/fixture/protected-api.mjs"]
    volumes:
      - ./fixtures:/fixture:ro
    environment:
      - VERIFIER_URL=http://policy-verifier:3000
    ports:
      - "3096:3000"
    depends_on:
      policy-verifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  protected-proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3095:80"
    environment:
      - AUTH_MODE=validation
      - INTROSPECT_URL=http://provider:3000/oauth/introspect
      - INTROSPECT_CACHE_TTL_SEC=5
      - UPSTREAM_BASEURL=http://protected-api:3000
    depends_on:
      protected-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  # ---- auth.proxy against the real provider, beyond uncredentialed validation
  # The upstream for every service below: it echoes the `authorization` and
  # `cookie` headers it received, so the suites assert on what the proxy
  # actually forwarded (tests/fixtures/echo-upstream.mjs).
  echo-upstream:
    image: node:24-alpine
    command: ["node", "/fixture/echo-upstream.mjs"]
    volumes:
      - ./fixtures:/fixture:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Injection mode: the browser's session cookie is exchanged at the
  # provider's `session` grant and injected upstream as a Bearer.
  injection-proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3094:80"
    environment:
      - AUTH_MODE=injection
      # An origin, not a URL: the proxy appends /oauth/token itself.
      - INJECTION_PROVIDER_ORIGIN=http://provider:3000
      # Registered in tests/provider/clients.yaml for the `session` grant.
      - INJECTION_CLIENT_ID=e2e-bff
      - INJECTION_SCOPE=read:project
      # The provider's session cookie name (SESSION_NAME / SESSION_STORE_NAME
      # above); the proxy defaults to connect.sid.
      - INJECTION_SESSION_COOKIE_NAME=auth.session
      # The default, spelled out: the sibling service below turns it on, and
      # the suite asserts the pass-through this one keeps.
      - INJECTION_STRIP_INBOUND_AUTHORIZATION=false
      - UPSTREAM_BASEURL=http://echo-upstream:3000
    depends_on:
      provider:
        condition: service_healthy
      echo-upstream:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  # The same, with a client's own Authorization dropped on every request the
  # proxy did not mint a token for. A separate service rather than a toggle,
  # so each behaviour is asserted against the configuration that produces it.
  injection-strip-proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3093:80"
    environment:
      - AUTH_MODE=injection
      - INJECTION_PROVIDER_ORIGIN=http://provider:3000
      - INJECTION_CLIENT_ID=e2e-bff
      - INJECTION_SCOPE=read:project
      - INJECTION_SESSION_COOKIE_NAME=auth.session
      - INJECTION_STRIP_INBOUND_AUTHORIZATION=true
      - UPSTREAM_BASEURL=http://echo-upstream:3000
    depends_on:
      provider:
        condition: service_healthy
      echo-upstream:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Validation mode authenticating to introspection as a confidential client,
  # which switches on the provider's audience pin.
  credentialed-proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3092:80"
    environment:
      - AUTH_MODE=validation
      - INTROSPECT_URL=http://provider:3000/oauth/introspect
      # Registered as `e2e-resource-server` in tests/provider/clients.yaml,
      # which holds the second copy of this secret (volume-mounted, so
      # interpolation cannot share one definition between them).
      - CLIENT_ID=e2e-resource-server
      - CLIENT_SECRET=AfAFXyzwkkaSic+H6vMwW/Lb7ud5u7C6j1TinH8AzF0=
      - UPSTREAM_BASEURL=http://echo-upstream:3000
    depends_on:
      provider:
        condition: service_healthy
      echo-upstream:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  # The same client with a wrong secret: the provider refuses the proxy's own
  # credentials, which the proxy answers 502, not 401.
  misconfigured-proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3091:80"
    environment:
      - AUTH_MODE=validation
      - INTROSPECT_URL=http://provider:3000/oauth/introspect
      - CLIENT_ID=e2e-resource-server
      - CLIENT_SECRET=not-the-registered-secret
      - UPSTREAM_BASEURL=http://echo-upstream:3000
    depends_on:
      provider:
        condition: service_healthy
      echo-upstream:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

secrets:
  npmrc:
    file: ~/.npmrc
