services:
  redis:
    image: redis:7-alpine
    ports:
      - "6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5

  provider:
    build:
      context: ..
      dockerfile: tests/dockerfiles/provider.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3099:3000"
    environment:
      - OAUTH_JWT_SECRET=test-secret-for-e2e
      - SESSION_SECRET=test-session-secret
      - SESSION_STORAGE_REDIS_URL=redis://redis:6379
      - CLIENT_USER_AUTHENTICATE_URL=http://127.0.0.1:3000/authenticate
      - CLIENT_USER_AUTHENTICATE_BY_TOKEN_URL=http://127.0.0.1:3000/authenticate/token
      - SESSION_SECURE=false
      - CLIENT_CODE_ENDPOINT_URI=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10

  proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3098:80"
    environment:
      - INTROSPECT_URL=http://provider:3000/oauth/introspect
      - ENDPOINT_BASEURL=http://provider:3000
    depends_on:
      provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10

  policy-verifier:
    build:
      context: ../repos/auth.policy-verifier
      dockerfile: ../../tests/dockerfiles/policy-verifier.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3097:3000"
    volumes:
      - ./abac/application.conf:/home/node/templates/standalone/config/application.conf:ro
    environment:
      - OAUTH_JWT_SECRET=test-secret-for-e2e
    depends_on:
      provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10

secrets:
  npmrc:
    file: ~/.npmrc
