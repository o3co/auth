services:
  redis:
    image: redis:7-alpine
    # The settings the provider's Redis store checks at boot and refuses to
    # start without: every write fsynced to an append-only file, and no
    # eviction (the image's default).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5

  provider:
    build:
      context: ../repos/auth.provider
      dockerfile: ../../tests/dockerfiles/provider.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3099:3000"
    volumes:
      # The local layer: lists, the signing key, users and clients. The image's
      # WORKDIR is the generated app, whose configuration lives in config/.
      - ./provider/local.conf:/home/node/app/config/local.conf:ro
    environment:
      # ---- Configuration files ---------------------------------------------
      # Earlier files win: the local layer over the generated file, which
      # reads each variable below. A variable no configuration file reads has
      # no effect.
      - APP_CONFIG=config/local.conf,config/application.conf

      # ---- Where the provider is -----------------------------------------
      # The issuer, defined once in the Makefile, is also the public origin:
      # the provider requires the issuer on its public origin, compares a
      # login's and the `session` grant's Origin with it, and builds its
      # redirects on it. It is where the suites reach the provider (the host
      # port below), over plain http, which an http public origin takes only
      # with HTTP_INSECURE_ORIGIN; its cookies are then not Secure.
      - ISSUER_URL=${OAUTH_JWT_ISSUER:?run via make test-e2e}
      - HTTP_PUBLIC_ORIGIN=${OAUTH_JWT_ISSUER:?run via make test-e2e}
      - HTTP_INSECURE_ORIGIN=true
      # Every interface, at the port the other services reach it at
      # (http://provider:3000).
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=3000
      # Read by tests/provider/local.conf, for the clients' audiences.
      - OAUTH_JWT_AUDIENCE=${OAUTH_JWT_AUDIENCE:?run via make test-e2e}

      # ---- Signing -------------------------------------------------------
      # The key and its `kid` are in tests/provider/local.conf.
      - KEYS_SIGNING_ALG=ES256

      # ---- Sender binding ------------------------------------------------
      # DPoP and mTLS are composed so the provider vouches for a bound token,
      # and the suite proves that a Bearer-only consumer refuses it, not that
      # the provider never issued it. Any certificate binds: the suite binds
      # none, it only presents tokens bound to one.
      - MTLS_MODE=self-signed

      # ---- Deployment and state -------------------------------------------
      # One instance. Its store is Redis (the image composes the redis store
      # axis), and no setting accepts a store in process memory, so a drift
      # back to one refuses boot rather than silently leaving the Redis paths
      # unexercised.
      - KERNEL_DEPLOYMENT=single
      - REDIS_URL=redis://redis:6379
      # A single server with no replica and no failover.
      - REDIS_REPLICATION=none
      # Revoked access tokens are kept in a denylist and refused; the
      # provider requires revocation where it issues refresh tokens and codes.
      - TOKENS_REVOCATION=denylist

      # ---- Pages ---------------------------------------------------------
      # Where `/authorize` sends a browser with no session. The suite logs in
      # at `POST /session/login` itself and never follows it; the provider
      # requires it, on its own origin. No consent page: `/authorize` then
      # admits first-party clients only.
      - AUTHORIZE_LOGIN_PAGE=${OAUTH_JWT_ISSUER:?run via make test-e2e}/login
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10

  proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3098:80"
    environment:
      # auth.mode has no default — the proxy refuses to boot without it
      - AUTH_MODE=validation
      - INTROSPECT_URL=http://provider:3000/oauth/introspect
      # The provider answers introspection to an authenticated confidential
      # client alone, so every validation-mode proxy authenticates, as
      # `e2e-resource-server` in tests/provider/local.conf, which holds the
      # hash of this secret. The other validation-mode proxies name these two
      # entries.
      - &introspection-client-id CLIENT_ID=e2e-resource-server
      - &introspection-client-secret CLIENT_SECRET=AfAFXyzwkkaSic+H6vMwW/Lb7ud5u7C6j1TinH8AzF0=
      - UPSTREAM_BASEURL=http://provider:3000
    depends_on:
      provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10

  policy-verifier:
    build:
      context: ../repos/auth.policy-verifier
      dockerfile: ../../tests/dockerfiles/policy-verifier.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3097:3000"
    volumes:
      - ./abac/application.conf:/home/node/templates/standalone/config/application.conf:ro
    environment:
      # auth.policy-verifier validates iss / aud / typ per RFC 9068 §4 and
      # refuses to boot without them. The issuer must match what the provider
      # stamps, and the audience must match what the provider's `resource`
      # parameter puts on the access token.
      - OAUTH_JWT_ISSUER=${OAUTH_JWT_ISSUER:?run via make test-e2e}
      - OAUTH_JWT_AUDIENCE=${OAUTH_JWT_AUDIENCE:?run via make test-e2e}
    depends_on:
      provider:
        condition: service_healthy
    healthcheck:
      # The stack-wide liveness path, the one the provider and the proxy are
      # probed on above. The verifier also answers `/healthcheck` as a
      # compatibility alias; the E2E probes the spelling docs/architecture.md
      # records.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10

  protected-api:
    image: node:24.22-alpine
    command: ["node", "/fixture/protected-api.mjs"]
    volumes:
      - ./fixtures:/fixture:ro
    environment:
      - VERIFIER_URL=http://policy-verifier:3000
    ports:
      - "3096:3000"
    depends_on:
      policy-verifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  protected-proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3095:80"
    environment:
      - AUTH_MODE=validation
      - INTROSPECT_URL=http://provider:3000/oauth/introspect
      - INTROSPECT_CACHE_TTL_SEC=5
      - *introspection-client-id
      - *introspection-client-secret
      - UPSTREAM_BASEURL=http://protected-api:3000
    depends_on:
      protected-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  # ---- auth.proxy against the real provider, beyond plain validation
  # The upstream for every service below: it echoes the `authorization` and
  # `cookie` headers it received, so the suites assert on what the proxy
  # actually forwarded (tests/fixtures/echo-upstream.mjs).
  echo-upstream:
    image: node:24.22-alpine
    command: ["node", "/fixture/echo-upstream.mjs"]
    volumes:
      - ./fixtures:/fixture:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Injection mode: the browser's session cookie is exchanged at the
  # provider's `session` grant and injected upstream as a Bearer.
  injection-proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3094:80"
    environment:
      - AUTH_MODE=injection
      # An origin, not a URL: the proxy appends /oauth/token itself.
      - INJECTION_PROVIDER_ORIGIN=http://provider:3000
      # Registered in tests/provider/local.conf for the `session` grant.
      - INJECTION_CLIENT_ID=e2e-bff
      - INJECTION_SCOPE=read:project
      # The provider's session cookie, whose name the provider fixes over
      # plain http; the proxy defaults to connect.sid.
      - INJECTION_SESSION_COOKIE_NAME=session
      # The default, spelled out: the sibling service below turns it on, and
      # the suite asserts the pass-through this one keeps.
      - INJECTION_STRIP_INBOUND_AUTHORIZATION=false
      # The origin the browser sees this proxy at: the provider's public
      # origin, as the browser sends the provider's session cookie only there,
      # so the proxy and the provider are one origin to it (plain http, like
      # the socket the proxy sees). A session-cookie request is answered from
      # the proxy's token cache only when its Origin is this one, or it has no
      # Origin and says Sec-Fetch-Site: same-origin; any other asks the
      # provider itself, which takes the same evidence for the same origin.
      - INJECTION_PUBLIC_ORIGIN=${OAUTH_JWT_ISSUER:?run via make test-e2e}
      - UPSTREAM_BASEURL=http://echo-upstream:3000
    depends_on:
      provider:
        condition: service_healthy
      echo-upstream:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  # The same, with a client's own Authorization dropped on every request the
  # proxy did not mint a token for. A separate service rather than a toggle,
  # so each behaviour is asserted against the configuration that produces it.
  injection-strip-proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3093:80"
    environment:
      - AUTH_MODE=injection
      - INJECTION_PROVIDER_ORIGIN=http://provider:3000
      - INJECTION_CLIENT_ID=e2e-bff
      - INJECTION_SCOPE=read:project
      - INJECTION_SESSION_COOKIE_NAME=session
      - INJECTION_STRIP_INBOUND_AUTHORIZATION=true
      - UPSTREAM_BASEURL=http://echo-upstream:3000
    depends_on:
      provider:
        condition: service_healthy
      echo-upstream:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Validation mode authenticating to introspection as a confidential client,
  # whose registered audiences the provider pins the introspected token's to.
  credentialed-proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3092:80"
    environment:
      - AUTH_MODE=validation
      - INTROSPECT_URL=http://provider:3000/oauth/introspect
      - *introspection-client-id
      - *introspection-client-secret
      - UPSTREAM_BASEURL=http://echo-upstream:3000
    depends_on:
      provider:
        condition: service_healthy
      echo-upstream:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  # The same client with a wrong secret: the provider refuses the proxy's own
  # credentials, which the proxy answers 502, not 401.
  misconfigured-proxy:
    build:
      context: ../repos/auth.proxy
      dockerfile: ../../tests/dockerfiles/proxy.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3091:80"
    environment:
      - AUTH_MODE=validation
      - INTROSPECT_URL=http://provider:3000/oauth/introspect
      - *introspection-client-id
      - CLIENT_SECRET=not-the-registered-secret
      - UPSTREAM_BASEURL=http://echo-upstream:3000
    depends_on:
      provider:
        condition: service_healthy
      echo-upstream:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/_healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10

  # ---- An HS256 provider and verifier pair on one shared secret
  # Apart from the ES256 stack above: a provider of its own, signing with a
  # shared secret, and two verifiers given the same secret string. The paired
  # verifier names the encoding the provider names; the other leaves its own
  # default, so it derives other key bytes from the same string
  # (tests/abac/hs256-pair.test.js, docs/claims-contract.md).
  provider-hs256:
    build:
      context: ../repos/auth.provider
      dockerfile: ../../tests/dockerfiles/provider.Dockerfile
      target: runtime-hs256
      secrets:
        - npmrc
    ports:
      - "3090:3000"
    volumes:
      - ./provider/hs256.conf:/home/node/app/config/local.conf:ro
    environment:
      - APP_CONFIG=config/local.conf,config/application.conf
      # Its issuer and public origin, defined once in the Makefile, at the
      # host port above, as the ES256 provider's are.
      - ISSUER_URL=${HS256_ISSUER:?run via make test-e2e}
      - HTTP_PUBLIC_ORIGIN=${HS256_ISSUER:?run via make test-e2e}
      - HTTP_INSECURE_ORIGIN=true
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=3000
      - OAUTH_JWT_AUDIENCE=${OAUTH_JWT_AUDIENCE:?run via make test-e2e}
      # The shared secret's one definition, read by tests/provider/hs256.conf
      # and by both verifiers below through tests/abac/hs256.conf: 32 random
      # bytes in hex. The encoding each side reads it in is named apart.
      - &hs256-secret HS256_SECRET=b291c3565766f8f1faa335657977b658cf2306d7f55f01647fab65a02a0f14c2
      # One instance, its store in process memory, which the provider takes
      # only when told it is volatile.
      - KERNEL_DEPLOYMENT=single
      - STORE_ACCEPT_VOLATILE=true
      # No revocation endpoint is composed, so none is offered.
      - TOKENS_REVOCATION=unsupported
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Paired: the encoding the provider names.
  policy-verifier-hs256:
    build:
      context: ../repos/auth.policy-verifier
      dockerfile: ../../tests/dockerfiles/policy-verifier.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3089:3000"
    volumes:
      - ./abac/hs256.conf:/home/node/templates/standalone/config/application.conf:ro
    environment:
      - &hs256-verifier-issuer OAUTH_JWT_ISSUER=${HS256_ISSUER:?run via make test-e2e}
      - &hs256-verifier-audience OAUTH_JWT_AUDIENCE=${OAUTH_JWT_AUDIENCE:?run via make test-e2e}
      - *hs256-secret
      - OAUTH_JWT_SECRET_ENCODING=hex
    depends_on:
      provider-hs256:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Not paired: no encoding named, so the verifier's default, utf8, reads the
  # same string as other bytes. Both sides boot; every token is refused.
  policy-verifier-hs256-unpaired:
    build:
      context: ../repos/auth.policy-verifier
      dockerfile: ../../tests/dockerfiles/policy-verifier.Dockerfile
      target: runtime
      secrets:
        - npmrc
    ports:
      - "3088:3000"
    volumes:
      - ./abac/hs256.conf:/home/node/templates/standalone/config/application.conf:ro
    environment:
      - *hs256-verifier-issuer
      - *hs256-verifier-audience
      - *hs256-secret
    depends_on:
      provider-hs256:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 10

secrets:
  npmrc:
    file: ~/.npmrc
