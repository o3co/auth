http {
  hostname = "0.0.0.0"
  hostname = ${?HTTP_HOSTNAME}
  port = 3000
  port = ${?HTTP_PORT}
  pathPrefix = ""
  pathPrefix = ${?HTTP_PATH_PREFIX}
}

oauth {
  jwt {
    # The provider signs with ES256 (tests/provider/local.conf, which says
    # why), and this is the public half of its key there. The verifier takes a
    # JWKS only over https or at a loopback host, and reaches the provider at
    # neither, so the key is written here. A key that drifted from the
    # provider's fails "the verifier holds the provider's signing key" in
    # tests/abac/index.test.js before it reads as a policy failure.
    algorithm = "ES256"
    publicKey = """-----BEGIN PUBLIC KEY-----
MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEwMFJRjtqtW+PUvQubb8HQ1wwmBvX
VLs/erIGF9twkzgeQScrIps+Vd5AvTz7+NQmPg8L+1OgX4R+PMT4mOB0uQ==
-----END PUBLIC KEY-----"""
    # RFC 9068 §4 — required by auth.policy-verifier whenever mode is "verify".
    # This file is mounted OVER the template's application.conf, so the
    # substitutions have to be repeated here or the keys are simply absent.
    issuer = ${?OAUTH_JWT_ISSUER}
    audience = ${?OAUTH_JWT_AUDIENCE}
    # One enum decides how tokens are checked; the verifier refuses to boot on
    # the `validate` / `allowInsecureDecode` keys.
    mode = "verify"
    mode = ${?OAUTH_JWT_MODE}
  }
}

# The two blocks below ARE the provider→verifier claim mapping, not test
# plumbing — see docs/claims-contract.md for the full correspondence.
attribute {
  # PayloadScopeCollector splits the access token's `scope` claim — minted by
  # auth.provider as a space-delimited string (RFC 6749 §3.3) — into the
  # verifier's ATTR_SCOPES. The claim's shape is owned by auth.provider
  # (tests/token-flow asserts a string, not an array); the verifier only
  # splits it. PayloadSubjectIdCollector lifts `sub` into ATTR_USER_ID — the
  # identity vocabulary auth.provider owns — and `azp` into ATTR_CLIENT_ID;
  # the provider's access tokens name their client in RFC 9068's `client_id`
  # instead, so no rule here reads ATTR_CLIENT_ID.
  collectors = [
    { collector = "PayloadScopeCollector" }
    { collector = "PayloadSubjectIdCollector" }
  ]
}

rule {
  # ResourceActionScopeRuleCollector demands the `{action}:{resourceType}`
  # scope it derives from each /verify request (auth.policy-verifier
  # packages/builtins README, "Rule Collectors"). That grammar is OWNED by
  # auth.policy-verifier — it is why tests/provider/local.conf registers
  # `read:project` / `read:project.member`: the provider treats those as
  # opaque allowedScopes strings; only the verifier gives them structure.
  collectors = [
    { collector = "ResourceActionScopeRuleCollector" }
  ]
}
