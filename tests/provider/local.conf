# The provider's local layer for the cross-component E2E, mounted as the
# generated app's config/local.conf and listed first in APP_CONFIG, so it wins
# over the generated config/application.conf. That file reads the scalar keys
# from the environment tests/docker-compose.yml sets; this one holds what the
# environment cannot carry: lists, the PEM key, and the keys the generated
# file does not read. Disposable E2E rig only: every secret below is public.

audit.receivers = [log]

# The signing key. ES256, not the HS256 secret a resource server could share:
# the provider refuses to boot OpenID Connect (`oidc`) on a shared secret,
# since any party holding it could forge ID tokens, and the suite asserts on
# the ID token. auth.policy-verifier verifies with the public half, written in
# tests/abac/application.conf. The suites read this key out of this file to
# sign the tokens the provider would never issue (tests/shared/oauthFlow.js),
# so this is its one definition, and its `kid`'s.
keys.signing.kid = "e2e-1"
keys.signing.private-key = """-----BEGIN PRIVATE KEY-----
MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgzAke5t0owPlR4sy8
4FxugJroF8EfeJThEuCqoHbL1/GhRANCAATAwUlGO2q1b49S9C5tvwdDXDCYG9dU
uz96sgYX23CTOB5BJysimz5V3kC9PPv41CY+Dwv7U6BfhH48xPiY4HS5
-----END PRIVATE KEY-----"""

# The users the suite logs in as. The provider takes bcrypt or scrypt hashes,
# never a plain password: each hash below is of `e2e-password`.
users.registered = [
  # `email_verified = true` is what the verified-email issuance policy lets
  # through, on the code flow and on the `session` grant alike.
  {
    identifier = "e2e-user"
    subject = "user-e2e-1"
    password-hash = "$scrypt$ln=15,r=8,p=1$vV0oYYuvAVWXY6Y1hWMBiA$yaq1HtKuCVPyAQWJDuc3a3gY84qzSBwvRdfG6PPB6e0"
    attributes {
      email = "e2e-user@e2e.test"
      email_verified = true
      name = "E2E User"
    }
  }
  # A user whose email is not verified: the policy refuses every access token
  # for them.
  {
    identifier = "e2e-unverified"
    subject = "user-e2e-2"
    password-hash = "$scrypt$ln=15,r=8,p=1$vV0oYYuvAVWXY6Y1hWMBiA$yaq1HtKuCVPyAQWJDuc3a3gY84qzSBwvRdfG6PPB6e0"
    attributes {
      email = "e2e-unverified@e2e.test"
      email_verified = false
      name = "E2E Unverified User"
    }
  }
]

# The clients. A client is allowed no grant, scope or audience its
# `client-allowance` section does not list. OAUTH_JWT_AUDIENCE is the audience
# auth.policy-verifier pins, defined once in the Makefile and set in the
# provider's environment by tests/docker-compose.yml.
#
# The scopes `read:project` and `read:project.member` are written in
# auth.policy-verifier's `{action}:{resourceType}` grammar
# (ResourceActionScopeRuleCollector), which the provider compares opaquely:
# the ABAC suite needs tokens whose scope satisfies the verifier's derived
# rule. Grammar owner: auth.policy-verifier; string owner: this registration.
# See docs/claims-contract.md.
clients.registered = [
  # The suite's web app, a public client: no client authentication, so the
  # suite calls the token endpoint with `client_id` alone, and PKCE (S256, the
  # only method the provider takes) on every authorization. First-party, so
  # `/authorize` mints its codes with no consent page.
  #
  # Its first audience is the one a token gets when no `resource` is asked;
  # the second is the other audience the suite asks with `resource`, for a
  # token that is valid but not for the resource the verifier and the
  # credentialed proxy serve.
  {
    id = "e2e-app"
    kind = "public"
    method = "none"
    sections {
      authorize { redirect-uris = ["http://localhost:9099/callback"] }
      client-allowance {
        grants = ["authorization_code", "refresh_token", "session"]
        scopes = ["openid", "email", "read:project", "read:project.member"]
        audiences = [${OAUTH_JWT_AUDIENCE}, "https://other.e2e.test"]
      }
      consent { first-party = true }
    }
  }
  # A client not marked first-party. With no consent page configured,
  # `/authorize` refuses it with `unauthorized_client`: registered so the suite
  # proves the refusal rather than assume it.
  {
    id = "e2e-third-party"
    kind = "public"
    method = "none"
    sections {
      authorize { redirect-uris = ["http://localhost:9099/callback"] }
      client-allowance {
        grants = ["authorization_code"]
        scopes = ["openid", "read:project"]
        audiences = [${OAUTH_JWT_AUDIENCE}]
      }
    }
  }
  # The client auth.proxy's injection-mode services present on the `session`
  # grant (INJECTION_CLIENT_ID in tests/docker-compose.yml): a public client,
  # sending `client_id` and the browser's session cookie, never a secret. A
  # registration of its own, not `e2e-app`, so the suites tell from the
  # token's `client_id` that the upstream's token was minted for the proxy.
  {
    id = "e2e-bff"
    kind = "public"
    method = "none"
    sections {
      client-allowance {
        grants = ["session"]
        scopes = ["read:project"]
        audiences = [${OAUTH_JWT_AUDIENCE}]
      }
    }
  }
  # The confidential client every validation-mode auth.proxy authenticates to
  # `POST /oauth/introspect` as (CLIENT_ID / CLIENT_SECRET in
  # tests/docker-compose.yml): the provider answers introspection to
  # confidential clients alone, and reports a token active only when its
  # audience is one this client may see. No grant: it only introspects.
  #
  # The hash is of the proxies' CLIENT_SECRET, whose `+`, `/` and `=` exercise
  # the RFC 6749 §2.3.1 form encoding of the Basic header end to end.
  {
    id = "e2e-resource-server"
    kind = "confidential"
    method = "client_secret_basic"
    sections {
      client-secret { hash = "$scrypt$ln=15,r=8,p=1$152pE8djUtoZNjANo6HtUQ$elJUP7iIoqsyuakLJS4Rvysp9rkXiN5lWYUNTRIoGUs" }
      client-allowance { audiences = [${OAUTH_JWT_AUDIENCE}] }
    }
  }
  # The suites' own view of a token (`introspect` in tests/shared/oauthFlow.js):
  # a confidential client that may see both of `e2e-app`'s audiences, so a
  # token it reports inactive is one the provider does not vouch for at all.
  # Its secret is INTROSPECTOR_SECRET there.
  {
    id = "e2e-introspector"
    kind = "confidential"
    method = "client_secret_basic"
    sections {
      client-secret { hash = "$scrypt$ln=15,r=8,p=1$1TjMB3DB9LUt7rAd3POFFw$90/pTw+uDDfsi+iD6XNwCazCXNQlJMp7sOdg6RPMMWM" }
      client-allowance { audiences = [${OAUTH_JWT_AUDIENCE}, "https://other.e2e.test"] }
    }
  }
]
