# The local layer of the HS256 provider (`provider-hs256` in
# tests/docker-compose.yml), listed first in its APP_CONFIG like local.conf is
# for the ES256 one. Disposable E2E rig only: every secret below is public.

audit.receivers = [log]

# No user, so no module checks a subject's revocation; the provider takes that
# only when stated.
tokens.subject-check = "none"

# The shared secret, read as hex. HS256_SECRET is set once in
# tests/docker-compose.yml, for this provider and both HS256 verifiers. The
# encoding is named here and, separately, on the verifier that pairs with this
# provider: each side reads the string as its own encoding says, and the two
# agree only when both name the same one (docs/claims-contract.md, "The HS256
# shared secret").
keys.signing {
  kid = "e2e-hs256-1"
  alg = "HS256"
  secret = ${HS256_SECRET}
  secret-encoding = "hex"
}

# The one client: a service taking client credentials for the audience the
# HS256 verifiers pin, with the scope their rule derives from
# `read` on `project:1`. Its secret is HS256_CLIENT_SECRET in
# tests/abac/hs256-pair.test.js.
clients.registered = [
  {
    id = "e2e-hs256-service"
    kind = "confidential"
    method = "client_secret_basic"
    sections {
      client-secret { hash = "$scrypt$ln=15,r=8,p=1$mFIAkn9TFKZh9RordbR6EQ$cTIXiy8OTCC0VQhe2ocjirEAmuLnghL6hR8ovCziRGw" }
      client-allowance {
        grants = ["client_credentials"]
        scopes = ["read:project"]
        audiences = [${OAUTH_JWT_AUDIENCE}]
      }
    }
  }
]
