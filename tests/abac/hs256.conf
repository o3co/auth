# auth.policy-verifier against the HS256 provider (`provider-hs256` in
# tests/docker-compose.yml), mounted as the template's application.conf of
# both HS256 verifiers there. They differ only in OAUTH_JWT_SECRET_ENCODING:
# the paired one names the provider's encoding, the other leaves the
# verifier's default.

http {
  hostname = "0.0.0.0"
  port = 3000
}

oauth {
  jwt {
    algorithm = "HS256"
    # The string the provider signs with, set once in
    # tests/docker-compose.yml.
    secret = ${HS256_SECRET}
    # How the string becomes key bytes. The provider names `hex`
    # (tests/provider/hs256.conf); unset, the verifier reads utf8.
    secretEncoding = ${?OAUTH_JWT_SECRET_ENCODING}
    issuer = ${?OAUTH_JWT_ISSUER}
    audience = ${?OAUTH_JWT_AUDIENCE}
    mode = "verify"
  }
}

# The scope rule the ES256 verifier applies (tests/abac/application.conf), so
# an allow here says the signature was accepted and the scope met.
attribute {
  collectors = [
    { collector = "PayloadScopeCollector" }
    { collector = "PayloadSubjectIdCollector" }
  ]
}

rule {
  collectors = [
    { collector = "ResourceActionScopeRuleCollector" }
  ]
}
