# User fixture for the cross-component E2E, consumed by the standalone
# template's YAML user repository (CLIENT_USER_TYPE=yaml).
#
# The template defaults `repositories.user.type` to "http", which needs a
# separate identity service to answer CLIENT_USER_AUTHENTICATE_URL. The E2E has
# no such service, so it switches the adapter to "yaml" and ships the directory
# here — `POST /session/login` then authenticates against this file.
#
# `emailVerified: true` (camelCase — the `User` field name; the OIDC claim it
# surfaces as is `email_verified`) is what satisfies the provider's
# `requireEmailVerified` gate at `/authorize` (auth.provider#297/#320). The
# compose turns that gate ON so the happy path proves the gate passes a
# verified user rather than proving nothing because the gate was off.
#
# The password is stored in plain text on purpose: the in-memory repository
# accepts either a bcrypt hash or a literal, and a literal keeps the fixture
# readable. Never do this outside a disposable test rig.
e2e-user:
  id: "user-e2e-1"
  password: "e2e-password"
  email: "e2e-user@e2e.test"
  emailVerified: true
  name: "E2E User"

# A second user whose email the Store has NOT verified. `/authorize` must
# refuse this one with `access_denied` while `requireEmailVerified` is on.
e2e-unverified:
  id: "user-e2e-2"
  password: "e2e-password"
  email: "e2e-unverified@e2e.test"
  emailVerified: false
  name: "E2E Unverified User"
