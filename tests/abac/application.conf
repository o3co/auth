http {
  hostname = "0.0.0.0"
  hostname = ${?HTTP_HOSTNAME}
  port = 3000
  port = ${?HTTP_PORT}
  pathPrefix = ""
  pathPrefix = ${?HTTP_PATH_PREFIX}
}

oauth {
  jwt {
    secret = ${?OAUTH_JWT_SECRET}
    # RFC 9068 §4 — required by auth.policy-verifier whenever mode is "verify".
    # This file is mounted OVER the template's application.conf, so the
    # substitutions have to be repeated here or the keys are simply absent.
    issuer = ${?OAUTH_JWT_ISSUER}
    audience = ${?OAUTH_JWT_AUDIENCE}
    # auth.policy-verifier#134 replaced the validate / allowInsecureDecode pair
    # with one enum; the verifier now refuses to boot on the removed keys.
    mode = "verify"
    mode = ${?OAUTH_JWT_MODE}
  }
}

# The two blocks below ARE the provider→verifier claim mapping, not test
# plumbing — see docs/claims-contract.md for the full correspondence.
attribute {
  # PayloadScopeCollector splits the access token's `scope` claim — minted by
  # auth.provider as a space-delimited string (RFC 6749 §3.3) — into the
  # verifier's ATTR_SCOPES. The claim's shape is owned by auth.provider
  # (o3co/auth#3 pinned string-not-array in tests/token-flow); the verifier
  # only splits it. PayloadSubjectIdCollector lifts `sub`/`azp` into
  # ATTR_USER_ID/ATTR_CLIENT_ID — the identity vocabulary auth.provider owns.
  collectors = [
    { collector = "PayloadScopeCollector" }
    { collector = "PayloadSubjectIdCollector" }
  ]
}

rule {
  # ResourceActionScopeRuleCollector demands the `{action}:{resourceType}`
  # scope it derives from each /verify request (auth.policy-verifier
  # packages/builtins README, "Rule Collectors"). That grammar is OWNED by
  # auth.policy-verifier — it is why tests/provider/clients.yaml registers
  # `read:project` / `read:project.member`: the provider treats those as
  # opaque allowedScopes strings; only the verifier gives them structure.
  collectors = [
    { collector = "ResourceActionScopeRuleCollector" }
  ]
}
